# Configurações do Banco PostgreSQL
# Lê os dados de variáveis de ambiente da nuvem (Render, Railway, Heroku, etc.)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devshowcase_prod}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desativa o console H2 em produção por segurança
spring.h2.console.enabled=false